{% extends "base.html" %}
{% block title %}Мэдэгдэл{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
      <h1 class="h4 mb-0">Мэдэгдэл</h1>
      {% if unread_notification_count %}
        <form method="post" action="{{ url_for('notifications.read_all') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-sm btn-outline-secondary">Бүгдийг уншсан</button>
        </form>
      {% endif %}
    </div>

    {% if notifications %}
      <ul class="list-group">
        {% for n in notifications %}
          <li class="list-group-item p-0{% if not n.is_read %} border-start border-primary border-4{% endif %}">
            <form method="post" action="{{ url_for('notifications.open_notification', notification_id=n.id) }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn w-100 text-start py-3 px-3 rounded-0">
                <div class="d-flex justify-content-between gap-2">
                  <span class="{% if not n.is_read %}fw-semibold{% endif %}">{{ n.title }}</span>
                  {% if not n.is_read %}<span class="badge text-bg-primary">Шинэ</span>{% endif %}
                </div>
                <div class="small text-break">{{ n.message }}</div>
                <div class="small text-muted">{{ n.created_at|mn_datetime }}</div>
              </button>
            </form>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="text-muted">Мэдэгдэл алга.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
