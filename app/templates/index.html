{% extends "base.html" %}
{% block content %}
<div class="text-center py-4">
  <h1 class="h3 mb-3">Эрдэнэт Ажил</h1>
  <p class="lead">Өдрийн ажилтан болон ажил олгогчийг холбох товчоо.</p>
  {% if current_user.is_authenticated %}
    <a class="btn btn-primary" href="{{ url_for(current_user.dashboard_endpoint) }}">Миний самбар</a>
  {% else %}
    <div class="d-grid gap-2 col-md-6 mx-auto">
      <a class="btn btn-primary" href="{{ url_for('auth.register_worker') }}">Ажил хайж байна</a>
      <a class="btn btn-outline-primary" href="{{ url_for('auth.register_employer') }}">Ажилтан хайж байна</a>
      <a class="btn btn-link" href="{{ url_for('auth.login') }}">Нэвтрэх</a>
    </div>
  {% endif %}
</div>
{% endblock %}
